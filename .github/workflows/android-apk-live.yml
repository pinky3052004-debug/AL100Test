name: Android APK Screen YouTube Live

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag"
        required: true
        default: "v1.0.0"

      apk_asset:
        description: "APK filename in GitHub Release"
        required: true
        default: "my_app.apk"

      left_number:
        description: "Left bottom number"
        required: true
        default: "0-3-2"

      right_number_1:
        description: "Right number 1"
        required: true
        default: "5-7-8"

      right_number_2:
        description: "Right number 2"
        required: true
        default: "01-25-17"

      right_number_3:
        description: "Right number 3"
        required: true
        default: "53-76-83"

jobs:

  live:
    runs-on: ubuntu-latest

    timeout-minutes: 360

    permissions:
      contents: read

    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      APK_ASSET: ${{ inputs.apk_asset }}

      LEFT_NUMBER: ${{ inputs.left_number }}
      RIGHT_NUMBER_1: ${{ inputs.right_number_1 }}
      RIGHT_NUMBER_2: ${{ inputs.right_number_2 }}
      RIGHT_NUMBER_3: ${{ inputs.right_number_3 }}

      YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}

      TZ: Asia/Yangon

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # BASIC INFORMATION
      # ==========================================================

      - name: Show system information
        run: |
          echo "=========================================="
          echo "ANDROID APK YOUTUBE LIVE"
          echo "=========================================="

          echo "Runner:"
          uname -a

          echo "CPU:"
          nproc

          echo "Release:"
          echo "$RELEASE_TAG"

          echo "APK:"
          echo "$APK_ASSET"


      # ==========================================================
      # INSTALL PACKAGES
      # ==========================================================

      - name: Install required packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            python3 \
            python3-pip \
            python3-pil \
            fonts-noto-core \
            fonts-noto-extra \
            libimagequant0 \
            libraqm0

          echo "Packages installed."


      # ==========================================================
      # ENABLE KVM
      # ==========================================================

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          ls -l /dev/kvm || true


      # ==========================================================
      # SETUP ANDROID EMULATOR
      # ==========================================================

      - name: Start Android Emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2

          force-avd-creation: true
          disable-animations: true

          emulator-options: >
            -no-window
            -noaudio
            -no-boot-anim
            -gpu swiftshader_indirect

          script: |
            echo "Android Emulator started"

            adb devices

            adb shell getprop ro.build.version.release

            adb shell wm size

            adb shell wm density


      # ==========================================================
      # DOWNLOAD APK FROM GITHUB RELEASE
      # ==========================================================

      - name: Download APK from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |

          echo "=========================================="
          echo "DOWNLOADING APK"
          echo "=========================================="

          rm -f target_app.apk

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$APK_ASSET" \
            --output target_app.apk

          echo ""
          echo "APK downloaded:"
          ls -lh target_app.apk


      # ==========================================================
      # INSTALL APK
      # ==========================================================

      - name: Install APK
        run: |

          echo "=========================================="
          echo "INSTALLING APK"
          echo "=========================================="

          adb wait-for-device

          adb install -r target_app.apk

          echo ""
          echo "Installed packages:"
          adb shell pm list packages | grep -i "my" || true


      # ==========================================================
      # FIND PACKAGE NAME
      # ==========================================================

      - name: Detect APK package
        run: |

          echo "=========================================="
          echo "APK PACKAGE"
          echo "=========================================="

          adb shell pm list packages


      # ==========================================================
      # CREATE LIVE LAYOUT GENERATOR
      # ==========================================================

      - name: Create layout generator
        run: |

          cat > create_layout.py <<'PYTHON'

          from PIL import Image, ImageDraw, ImageFont
          import os
          import subprocess

          WIDTH = 1920
          HEIGHT = 1080

          LEFT_NUMBER = os.environ.get("LEFT_NUMBER", "0-3-2")
          RIGHT_NUMBER_1 = os.environ.get("RIGHT_NUMBER_1", "5-7-8")
          RIGHT_NUMBER_2 = os.environ.get("RIGHT_NUMBER_2", "01-25-17")
          RIGHT_NUMBER_3 = os.environ.get("RIGHT_NUMBER_3", "53-76-83")

          # ------------------------------------------------------
          # Find Myanmar font
          # ------------------------------------------------------

          try:
              font_path = subprocess.check_output(
                  ["fc-match", "-f", "%{file}", "Noto Sans Myanmar"]
              ).decode().strip()
          except:
              font_path = "/usr/share/fonts/truetype/noto/NotoSansMyanmar-Regular.ttf"

          print("Font:", font_path)

          def font(size):
              return ImageFont.truetype(font_path, size)

          def latin_font(size):
              paths = [
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
                  "/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf"
              ]

              for p in paths:
                  if os.path.exists(p):
                      return ImageFont.truetype(p, size)

              return ImageFont.load_default()

          # ------------------------------------------------------
          # Background
          # ------------------------------------------------------

          img = Image.new(
              "RGB",
              (WIDTH, HEIGHT),
              (255, 238, 85)
          )

          draw = ImageDraw.Draw(img)

          # ------------------------------------------------------
          # Main center panel
          # ------------------------------------------------------

          phone_x = 700
          phone_y = 45
          phone_w = 520
          phone_h = 990

          # Outer shadow
          draw.rounded_rectangle(
              (
                  phone_x - 12,
                  phone_y - 12,
                  phone_x + phone_w + 12,
                  phone_y + phone_h + 12
              ),
              radius=35,
              fill=(80, 80, 80)
          )

          # White border
          draw.rounded_rectangle(
              (
                  phone_x - 7,
                  phone_y - 7,
                  phone_x + phone_w + 7,
                  phone_y + phone_h + 7
              ),
              radius=30,
              fill=(255, 255, 255)
          )

          # ------------------------------------------------------
          # LEFT SIDE
          # ------------------------------------------------------

          draw.rounded_rectangle(
              (35, 45, 650, 1000),
              radius=30,
              fill=(255, 249, 190),
              outline=(20, 20, 20),
              width=5
          )

          draw.text(
              (70, 80),
              "လက်မှတ်ထိုး",
              font=font(48),
              fill=(20, 20, 20)
          )

          draw.text(
              (70, 145),
              "ရက်အတွက်",
              font=font(48),
              fill=(20, 20, 20)
          )

          draw.text(
              (95, 290),
              "12:01",
              font=latin_font(80),
              fill=(0, 0, 0)
          )

          draw.text(
              (80, 420),
              "ပေါက်မယ်",
              font=font(55),
              fill=(0, 0, 0)
          )

          draw.rounded_rectangle(
              (95, 535, 590, 665),
              radius=30,
              fill=(255, 255, 255),
              outline=(0, 0, 0),
              width=5
          )

          draw.text(
              (145, 555),
              LEFT_NUMBER,
              font=latin_font(75),
              fill=(150, 0, 0)
          )

          # ------------------------------------------------------
          # RIGHT SIDE
          # ------------------------------------------------------

          draw.rounded_rectangle(
              (1270, 45, 1885, 1000),
              radius=30,
              fill=(255, 249, 190),
              outline=(20, 20, 20),
              width=5
          )

          draw.text(
              (1310, 80),
              "မင်္ဂလာရှိသော",
              font=font(43),
              fill=(20, 20, 20)
          )

          # Number 1
          draw.rounded_rectangle(
              (1340, 260, 1815, 380),
              radius=30,
              fill=(220, 0, 0)
          )

          draw.text(
              (1410, 280),
              RIGHT_NUMBER_1,
              font=latin_font(65),
              fill=(255, 255, 255)
          )

          # Number 2
          draw.rounded_rectangle(
              (1340, 440, 1815, 560),
              radius=30,
              fill=(220, 0, 0)
          )

          draw.text(
              (1370, 460),
              RIGHT_NUMBER_2,
              font=latin_font(55),
              fill=(255, 255, 255)
          )

          # Number 3
          draw.rounded_rectangle(
              (1340, 620, 1815, 740),
              radius=30,
              fill=(220, 0, 0)
          )

          draw.text(
              (1370, 640),
              RIGHT_NUMBER_3,
              font=latin_font(55),
              fill=(255, 255, 255)
          )

          # ------------------------------------------------------
          # Top date placeholder
          # ------------------------------------------------------

          draw.text(
              (65, 10),
              "မြန်မာစံတော်ချိန်",
              font=font(30),
              fill=(0, 0, 0)
          )

          # ------------------------------------------------------
          # Save
          # ------------------------------------------------------

          img.save(
              "layout.png",
              "PNG"
          )

          print("Created layout.png")

          PYTHON

          python3 create_layout.py

          file layout.png
          ls -lh layout.png


      # ==========================================================
      # SHOW LAYOUT
      # ==========================================================

      - name: Verify layout
        run: |

          python3 - <<'PY'
          from PIL import Image

          img = Image.open("layout.png")

          print("Layout size:", img.size)
          print("Mode:", img.mode)
          PY


      # ==========================================================
      # FIND APK PACKAGE AUTOMATICALLY
      # ==========================================================

      - name: Find installed APK package
        id: package
        run: |

          PACKAGE=$(adb shell pm list packages \
            | sed 's/package://' \
            | grep -vE 'android|google|com.android' \
            | head -n 1 \
            | tr -d '\r')

          echo "Detected package:"
          echo "$PACKAGE"

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: Cannot detect APK package"
            exit 1
          fi

          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"


      # ==========================================================
      # LAUNCH APK
      # ==========================================================

      - name: Launch APK
        run: |

          PACKAGE="${{ steps.package.outputs.package }}"

          echo "Launching:"
          echo "$PACKAGE"

          adb shell monkey \
            -p "$PACKAGE" \
            1

          sleep 5

          echo "APK launched."


      # ==========================================================
      # WAKE SCREEN
      # ==========================================================

      - name: Wake Android screen
        run: |

          adb shell input keyevent KEYCODE_WAKEUP || true

          adb shell settings put system screen_off_timeout 2147483647 || true

          sleep 2


      # ==========================================================
      # TEST SCREEN CAPTURE
      # ==========================================================

      - name: Test Android screen capture
        run: |

          echo "Testing screen capture..."

          timeout 10s \
          adb exec-out \
            screenrecord \
            --output-format=h264 \
            --size 540x960 \
            --bit-rate 4000000 \
            --time-limit 5 \
            - \
            > test_screen.h264 || true

          ls -lh test_screen.h264 || true

          if [ ! -s test_screen.h264 ]; then
            echo "ERROR: Android screen capture failed"
            exit 1
          fi

          echo "Screen capture OK."


      # ==========================================================
      # START YOUTUBE LIVE
      # ==========================================================

      - name: Start YouTube Live
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |

          echo "=========================================="
          echo "STARTING YOUTUBE LIVE"
          echo "=========================================="

          if [ -z "$STREAM_KEY" ]; then
            echo "ERROR: YOUTUBE_STREAM_KEY is empty"
            exit 1
          fi

          rm -f test_screen.h264

          # ------------------------------------------------------
          # Android screen stream
          #
          # screenrecord has a time limit on many Android versions.
          # Restart it continuously.
          # ------------------------------------------------------

          (
            while true
            do

              echo "Starting Android screen segment..." >&2

              adb exec-out \
                screenrecord \
                --output-format=h264 \
                --size 540x960 \
                --bit-rate 4000000 \
                --time-limit 170 \
                -

              EXIT_CODE=$?

              echo "screenrecord ended: $EXIT_CODE" >&2

              sleep 1

            done

          ) | ffmpeg \
            -hide_banner \
            -loglevel info \
            -f h264 \
            -framerate 30 \
            -i - \
            -loop 1 \
            -i layout.png \
            -filter_complex "

              [0:v]
              scale=540:960:force_original_aspect_ratio=decrease,
              pad=540:960:(ow-iw)/2:(oh-ih)/2,
              setsar=1
              [phone];

              [1:v]
              scale=1920:1080
              [bg];

              [bg][phone]
              overlay=690:60:
              shortest=0
              [video];

            " \
            -map "[video]" \
            -map 0:a? \
            -c:v libx264 \
            -preset veryfast \
            -tune zerolatency \
            -pix_fmt yuv420p \
            -r 30 \
            -g 60 \
            -keyint_min 60 \
            -b:v 4500k \
            -maxrate 5000k \
            -bufsize 9000k \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"

        env:
          TZ: Asia/Yangon


      # ==========================================================
      # IF STREAM STOPS
      # ==========================================================

      - name: Stream finished
        if: always()
        run: |

          echo "=========================================="
          echo "STREAM WORKFLOW FINISHED"
          echo "=========================================="

          adb devices || true

          echo "Done."
